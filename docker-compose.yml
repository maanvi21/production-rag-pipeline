services:
  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  ingestion-service:
    build: ./ingestion-service
    ports:
      - "8001:8001"
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - qdrant
      - redis

  ingestion-worker:
    build: ./ingestion-service
    command: ["python", "-m", "app.worker"]
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - qdrant
      - redis

  query-service:
    build: ./query-service
    ports:
      - "8002:8002"
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: llama-3.3-70b-versatile
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - qdrant
      - redis

volumes:
  qdrant_data:
  redis_data:
