<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Candara, Segoe UI, Optima, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#404040"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f1f1f">Incident RAG Assistant – Architecture</text>
  <text x="600" y="54" text-anchor="middle" font-size="12" fill="#404040">(Phase 3: async ingestion + hybrid search + cache)</text>

  <!-- Section labels -->
  <text x="30" y="96" font-size="12" font-weight="700" fill="#1f4e79" text-decoration="underline">Ingestion path</text>
  <text x="30" y="601" font-size="12" font-weight="700" fill="#553c9a" text-decoration="underline">Query path</text>

  <!-- Arrows -->
  <path d="M 180 350 L 258 106" fill="none" stroke="#404040" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M 180 385 L 258 601" fill="none" stroke="#404040" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M 258 615 L 180 398" fill="none" stroke="#808080" stroke-width="1.25" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <path d="M 470 100 L 608 92" fill="none" stroke="#404040" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M 470 128 L 608 420" fill="none" stroke="#404040" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M 608 435 L 472 245" fill="none" stroke="#404040" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M 470 225 L 608 105" fill="none" stroke="#404040" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M 470 255 L 608 320" fill="none" stroke="#404040" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M 470 270 L 608 440" fill="none" stroke="#404040" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M 470 595 L 608 460" fill="none" stroke="#404040" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M 470 575 L 608 350" fill="none" stroke="#404040" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M 470 605 L 608 605" fill="none" stroke="#404040" stroke-width="1.25" marker-end="url(#arrow)"/>

  <!-- Edge labels -->
  <g font-size="10.5" fill="#262626">
    <rect x="475" y="73" width="64" height="13" fill="#ffffff"/>
    <text x="478" y="82">save_file()</text>

    <rect x="472" y="142" width="150" height="13" fill="#ffffff"/>
    <text x="475" y="151">XADD job + status:queued</text>

    <rect x="560" y="192" width="56" height="13" fill="#ffffff"/>
    <text x="563" y="201">get_file()</text>

    <rect x="548" y="402" width="76" height="13" fill="#ffffff"/>
    <text x="551" y="411">XREADGROUP</text>

    <rect x="525" y="292" width="94" height="13" fill="#ffffff"/>
    <text x="528" y="301">upsert_chunks()</text>

    <rect x="495" y="372" width="70" height="13" fill="#ffffff"/>
    <text x="498" y="381">status: done</text>

    <rect x="475" y="553" width="84" height="13" fill="#ffffff"/>
    <text x="478" y="562">cache get/set</text>

    <rect x="475" y="493" width="154" height="13" fill="#ffffff"/>
    <text x="478" y="502">vector search + BM25 scroll</text>

    <rect x="487" y="589" width="96" height="13" fill="#ffffff"/>
    <text x="490" y="598">chat completion</text>

    <rect x="195" y="208" width="72" height="13" fill="#ffffff"/>
    <text x="198" y="217">POST /upload</text>

    <rect x="185" y="493" width="68" height="13" fill="#ffffff"/>
    <text x="188" y="502">POST /query</text>

    <rect x="75" y="473" width="94" height="13" fill="#ffffff"/>
    <text x="78" y="482" fill="#595959">answer + sources</text>
  </g>

  <!-- Boxes: Office-theme flat fills, thin dark borders, modest corner radius -->
  <!-- Client -->
  <rect x="30" y="330" width="150" height="70" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="1.25"/>
  <text x="105" y="360" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f1f1f">Client</text>
  <text x="105" y="377" text-anchor="middle" font-size="10.5" fill="#404040">curl / browser</text>

  <!-- ingestion-service -->
  <rect x="260" y="70" width="210" height="72" rx="4" fill="#DAE3F3" stroke="#2E5395" stroke-width="1.25"/>
  <text x="365" y="97" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f1f1f">ingestion-service</text>
  <text x="365" y="113" text-anchor="middle" font-size="10.5" fill="#1f1f1f">:8001 – POST /upload</text>
  <text x="365" y="128" text-anchor="middle" font-size="9.5" fill="#333333">validate -&gt; stash -&gt; enqueue</text>

  <!-- ingestion-worker -->
  <rect x="260" y="205" width="210" height="72" rx="4" fill="#DAE3F3" stroke="#2E5395" stroke-width="1.25"/>
  <text x="365" y="232" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f1f1f">ingestion-worker</text>
  <text x="365" y="248" text-anchor="middle" font-size="10.5" fill="#1f1f1f">consumer group</text>
  <text x="365" y="263" text-anchor="middle" font-size="9.5" fill="#333333">extract -&gt; chunk -&gt; embed -&gt; upsert</text>

  <!-- query-service -->
  <rect x="260" y="565" width="210" height="72" rx="4" fill="#E4DFEC" stroke="#5F497A" stroke-width="1.25"/>
  <text x="365" y="592" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f1f1f">query-service</text>
  <text x="365" y="608" text-anchor="middle" font-size="10.5" fill="#1f1f1f">:8002 – POST /query</text>
  <text x="365" y="623" text-anchor="middle" font-size="9.5" fill="#333333">cache -&gt; hybrid search -&gt; rerank -&gt; LLM</text>

  <!-- MinIO -->
  <rect x="610" y="60" width="180" height="64" rx="4" fill="#E2EFDA" stroke="#375623" stroke-width="1.25"/>
  <text x="700" y="87" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f1f1f">MinIO</text>
  <text x="700" y="103" text-anchor="middle" font-size="10.5" fill="#1f1f1f">raw file bytes (durable)</text>

  <!-- Qdrant -->
  <rect x="610" y="300" width="180" height="64" rx="4" fill="#E2EFDA" stroke="#375623" stroke-width="1.25"/>
  <text x="700" y="327" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f1f1f">Qdrant</text>
  <text x="700" y="343" text-anchor="middle" font-size="10.5" fill="#1f1f1f">vector store (persistent)</text>

  <!-- Redis -->
  <rect x="610" y="400" width="180" height="72" rx="4" fill="#E2EFDA" stroke="#375623" stroke-width="1.25"/>
  <text x="700" y="427" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f1f1f">Redis</text>
  <text x="700" y="443" text-anchor="middle" font-size="10.5" fill="#1f1f1f">stream - job status</text>
  <text x="700" y="457" text-anchor="middle" font-size="10.5" fill="#1f1f1f">query cache (cache-aside)</text>

  <!-- Groq -->
  <rect x="610" y="565" width="180" height="64" rx="4" stroke-dasharray="5,3" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.25"/>
  <text x="700" y="592" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f1f1f">Groq API</text>
  <text x="700" y="608" text-anchor="middle" font-size="10.5" fill="#1f1f1f">hosted LLM (external)</text>

  <!-- Legend -->
  <g transform="translate(965,655)">
    <rect x="0" y="0" width="210" height="112" fill="#ffffff" stroke="#808080" stroke-width="1"/>
    <text x="10" y="17" font-size="10.5" font-weight="700" fill="#1f1f1f">Legend</text>
    <rect x="10" y="27" width="15" height="15" fill="#DAE3F3" stroke="#2E5395" stroke-width="1"/>
    <text x="31" y="39" font-size="10.5" fill="#1f1f1f">compute / service</text>
    <rect x="10" y="50" width="15" height="15" fill="#E2EFDA" stroke="#375623" stroke-width="1"/>
    <text x="31" y="62" font-size="10.5" fill="#1f1f1f">stateful data store</text>
    <rect x="10" y="73" width="15" height="15" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="31" y="85" font-size="10.5" fill="#1f1f1f">external hosted API</text>
    <rect x="10" y="96" width="15" height="15" fill="#E4DFEC" stroke="#5F497A" stroke-width="1"/>
    <text x="31" y="108" font-size="10.5" fill="#1f1f1f">query-side service</text>
  </g>

  <line x1="20" y1="500" x2="1180" y2="500" stroke="#bfbfbf" stroke-width="1" stroke-dasharray="2,3"/>
</svg>
